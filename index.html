<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Markets Lab</title>
<style>
  :root { --bg:#0b0f14; --card:#141a22; --text:#e7eef7; --muted:#8b9bb0; --ok:#3dd68c; --bad:#ff6b6b; --line:#243041; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 24px 8px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  .meta { color:var(--muted); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; padding:12px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  .value { font-size:22px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  section { padding:8px 24px 24px; }
  h2 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 8px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th { color:var(--muted); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  tr:last-child td { border-bottom:none; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#1b2430; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:12px; color:var(--accent); }
  #err { color:var(--bad); padding:0 24px; min-height:1.2em; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Markets Lab</h1>
  <div class="meta">poll <code>status.json</code> · every 20s · no secrets</div>
  <div class="meta" id="fetchAge">—</div>
</header>
<div id="err"></div>
<div class="grid">
  <div class="card"><div class="label">Open USD</div><div class="value" id="openUsd">—</div></div>
  <div class="card"><div class="label">Remaining Cap</div><div class="value" id="remainUsd">—</div></div>
  <div class="card"><div class="label">Max Cap</div><div class="value" id="maxUsd">—</div></div>
  <div class="card"><div class="label">Daemon</div><div class="value" id="daemon">—</div></div>
</div>
<section>
  <h2>Allowlist</h2>
  <div class="chips" id="allow"></div>
  <h2>Resting orders</h2>
  <table><thead><tr><th>Ticker</th><th>Side</th><th>Px¢</th><th>Qty</th><th>Oid</th></tr></thead><tbody id="resting"></tbody></table>
  <h2>Recent fills</h2>
  <table><thead><tr><th>Ticker</th><th>Side</th><th>Px¢</th><th>Qty</th><th>Ts</th></tr></thead><tbody id="fills"></tbody></table>
</section>
<script>
const $ = (id) => document.getElementById(id);
let lastOk = 0;
function money(n){ return (n==null||n==='')?'—':Number(n).toFixed(2); }
function row(cells){ return '<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>'; }
async function tick(){
  try{
    const r = await fetch('./status.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    lastOk = Date.now();
    $('err').textContent = '';
    $('openUsd').textContent = money(d.open_usd);
    $('remainUsd').textContent = money(d.remaining_usd);
    $('maxUsd').textContent = money(d.max_open_usd);
    const dm = d.daemon||{};
    const age = dm.heartbeat_age_sec;
    const alive = !!dm.alive;
    $('daemon').innerHTML = `<span class="${alive?'ok':'bad'}">${alive?'alive':'down'}</span> · ${dm.mode||'?'} · hb ${age==null?'?':age+'s'}`;
    $('allow').innerHTML = (d.allowlist||[]).map(s=>`<span class="chip">${s}</span>`).join('') || '<span class="meta">—</span>';
    $('resting').innerHTML = (d.resting_orders||[]).map(o=>row([
      `<code>${o.ticker||''}</code>`, o.side||'', o.price_cents??'—', o.qty??'—', `<code>${o.order_id_short||''}</code>`
    ])).join('') || row(['—','','','','']);
    $('fills').innerHTML = (d.recent_fills||[]).map(f=>row([
      `<code>${f.ticker||''}</code>`, f.side||'', f.price_cents??'—', f.qty??'—', `<code>${(f.ts||'').slice(0,19)}</code>`
    ])).join('') || row(['—','','','','']);
    $('fetchAge').textContent = 'updated '+(d.updated_at||'?')+' · fetched ok';
  }catch(e){
    $('err').textContent = 'fetch failed: '+e.message;
    if(lastOk) $('fetchAge').textContent = 'last ok ' + Math.round((Date.now()-lastOk)/1000) + 's ago';
  }
}
tick(); setInterval(tick, 20000);
</script>
</body>
</html>
